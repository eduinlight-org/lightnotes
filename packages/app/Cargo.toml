[package]
name = "app"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { workspace = true, features = ["router"] }
ui = { workspace = true }
editor = { workspace = true }
dioxus-icons = { version = "0.1.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
server = ["ui/server"]
