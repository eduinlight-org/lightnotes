[package]
name = "editor"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { workspace = true }
taino-edit-core = "0.5"
taino-edit-dom = "0.5"
taino-edit-extensions = "0.5"
taino-edit-table-view = "0.5"
wasm-bindgen = "0.2.121"
serde_json = "1"

[dependencies.web-sys]
version = "0.3.98"
features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlDivElement",
  "Node",
  "Event",
  "EventTarget",
  "KeyboardEvent",
  "KeyboardEventInit",
  "InputEvent",
  "CompositionEvent",
  "ClipboardEvent",
  "DataTransfer",
]
