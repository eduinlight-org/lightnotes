name: Deploy web app

on:
  push:
    # branches: [main]
    paths:
      - "apps/web/**"
      - "packages/app/**"
      - "packages/ui/**"
      - "packages/editor/**"
      - "packages/api-sdk/**"
      - "packages/sync-dto/**"
      - "packages/store-sdk/**"
      - "deploy/web/**"
      - "deploy/spa.conf"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  DIOXUS_CLI_VERSION: "0.7.9"
  IMAGE: ghcr.io/eduinlight-org/lightnotes-web
  API_BASE_URL: https://api-lightnotes.eduindev.com

jobs:
  build:
    runs-on: [self-hosted, homelab]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: web-${{ env.API_BASE_URL }}

      - name: Cache dioxus-cli
        id: cache-dx
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/dx
          key: dioxus-cli-${{ runner.os }}-${{ env.DIOXUS_CLI_VERSION }}

      - name: Install dioxus-cli
        if: steps.cache-dx.outputs.cache-hit != 'true'
        run: cargo install dioxus-cli --version ${{ env.DIOXUS_CLI_VERSION }} --locked

      - name: Build web app
        run: dx build --package web --platform web --release

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push image
        run: |
          docker build \
            -f deploy/web/Dockerfile \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

  bump-cd:
    needs: build
    uses: ./.github/workflows/cd-bump.yml
    with:
      image: ghcr.io/eduinlight-org/lightnotes-web
      tag: ${{ github.sha }}
    secrets: inherit
