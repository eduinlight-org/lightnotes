name: Release desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build for a dry run, without the leading v. No release is published."
        required: false
        type: string
        default: "dev"

permissions:
  contents: read

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: [self-hosted, homelab]
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve and verify version
        id: resolve
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"

            if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::tag ${GITHUB_REF_NAME} is not v<semver>, refusing to release"
              exit 1
            fi

            CARGO_VERSION="$(awk '
              /^\[package\]/ { in_pkg = 1; next }
              /^\[/          { in_pkg = 0 }
              in_pkg && /^version[[:space:]]*=/ {
                gsub(/[",]/, "")
                sub(/^version[[:space:]]*=[[:space:]]*/, "")
                print
                exit
              }
            ' apps/desktop/Cargo.toml)"

            if [ "$VERSION" != "$CARGO_VERSION" ]; then
              echo "::error::tag says ${VERSION} but apps/desktop/Cargo.toml says ${CARGO_VERSION}."
              echo "::error::The bundlers stamp the Cargo version into the artifacts, so these must agree."
              exit 1
            fi
          else
            VERSION="${{ inputs.version }}"
            echo "::notice::dry run for ${VERSION}, no release will be published"
          fi

          case "$VERSION" in
            *-*) PRERELEASE=true ;;
            *)   PRERELEASE=false ;;
          esac

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "resolved version ${VERSION} (prerelease=${PRERELEASE})"

  macos:
    needs: version
    uses: ./.github/workflows/release-desktop-macos.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  windows:
    needs: version
    uses: ./.github/workflows/release-desktop-windows.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  linux:
    needs: version
    uses: ./.github/workflows/release-desktop-linux.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  release:
    needs: [version, macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, homelab]
    permissions:
      contents: write
    steps:
      - name: Download every platform artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: desktop-*
          merge-multiple: true

      - name: Checksum and inventory
        run: |
          set -euo pipefail
          cd artifacts

          if [ -z "$(ls -A)" ]; then
            echo "::error::no artifacts were downloaded"
            exit 1
          fi

          sha256sum -- * > SHA256SUMS
          echo "publishing $(( $(ls | wc -l) - 1 )) artifacts:"
          cat SHA256SUMS

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: LightNotes ${{ needs.version.outputs.version }}
          draft: true
          prerelease: ${{ needs.version.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
