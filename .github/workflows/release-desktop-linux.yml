name: Release desktop (Linux)

on:
  workflow_call:
    inputs:
      version:
        description: "Version stamped into the artifact names, without the leading v"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version stamped into the artifact names, without the leading v"
        required: false
        type: string
        default: "dev"

permissions:
  contents: read

concurrency:
  group: release-desktop-linux-${{ github.ref }}
  cancel-in-progress: false

env:
  DIOXUS_CLI_VERSION: "0.7.9"
  API_BASE_URL: https://api-lightnotes.eduindev.com

jobs:
  bundle:
    runs-on: [self-hosted, homelab]
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: desktop-linux-${{ matrix.target }}

      - name: Cache dioxus-cli
        id: cache-dx
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/dx
          key: dioxus-cli-linux-${{ env.DIOXUS_CLI_VERSION }}

      - name: Install dioxus-cli
        if: steps.cache-dx.outputs.cache-hit != 'true'
        run: cargo install dioxus-cli --version ${{ env.DIOXUS_CLI_VERSION }} --locked

      - name: Bundle
        env:
          VERSION: ${{ inputs.version || 'dev' }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
          OUT_DIR: ${{ github.workspace }}/dist/linux
        run: ./scripts/linux-bundle.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ matrix.arch }}
          path: |
            dist/linux/*.AppImage
            dist/linux/*.deb
            dist/linux/*.rpm
          if-no-files-found: error
          retention-days: 7
