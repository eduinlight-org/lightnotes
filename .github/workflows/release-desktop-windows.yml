name: Release desktop (Windows)

on:
  workflow_call:
    inputs:
      version:
        description: "Version stamped into the artifact names, without the leading v"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version stamped into the artifact names, without the leading v"
        required: false
        type: string
        default: "dev"

permissions:
  contents: read

concurrency:
  group: release-desktop-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  DIOXUS_CLI_VERSION: "0.7.9"
  API_BASE_URL: https://api-lightnotes.eduindev.com

jobs:
  bundle:
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: desktop-windows-${{ matrix.target }}

      - name: Cache dioxus-cli
        id: cache-dx
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/dx.exe
          key: dioxus-cli-${{ runner.os }}-${{ env.DIOXUS_CLI_VERSION }}

      - name: Install dioxus-cli
        if: steps.cache-dx.outputs.cache-hit != 'true'
        run: cargo install dioxus-cli --version ${{ env.DIOXUS_CLI_VERSION }} --locked

      - name: Bundle
        shell: pwsh
        env:
          VERSION: ${{ inputs.version || 'dev' }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
          OUT_DIR: ${{ github.workspace }}\dist\windows
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: .\scripts\windows-bundle.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ matrix.arch }}
          path: |
            dist/windows/*.msi
            dist/windows/*-setup.exe
          if-no-files-found: error
          retention-days: 7
