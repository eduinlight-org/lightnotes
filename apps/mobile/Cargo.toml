[package]
name = "light-notes-mobile"
version.workspace = true
edition = "2021"

[[bin]]
name = "light-notes"
path = "src/main.rs"

[dependencies]
dioxus = { workspace = true, features = ["router", "fullstack"] }
app = { workspace = true }
ui = { workspace = true }

[features]
default = []
mobile = ["dioxus/mobile"]
server = ["dioxus/server", "app/server", "ui/server"]
