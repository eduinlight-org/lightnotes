[bundle]
identifier = "dev.lightnotes.desktop"
publisher = "LightNotes"
category = "Productivity"
short_description = "A fast, local-first notes app"
icon = [
  "icons/icon-32.png",
  "icons/icon-64.png",
  "icons/icon-128.png",
  "icons/icon-256.png",
  "icons/icon-512.png",
  "icons/icon.png",
]

[bundle.deb]
depends = [
  "libwebkit2gtk-4.1-0",
  "libgtk-3-0",
  "libayatana-appindicator3-1",
]
section = "utils"
priority = "optional"
