[package]
name = "api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "api"
path = "src/main.rs"

[dependencies]
sync-dto = { workspace = true }
serde = { version = "1", features = ["derive"] }
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
tower-http = { version = "0.7.0", features = ["cors", "limit", "trace"] }
axum-helmet = "1.0.2"
mongodb = "3.8.0"
mongodm = "0.10.1"
dotenvy = "0.15.7"
uuid = { version = "1.24.0", features = ["v4"] }
async-trait = "0.1.91"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-appender = "0.2.3"
serde_json = "1.0.151"
futures-util = "0.3.33"
tokio-stream = { version = "0.1.19", features = ["sync"] }
